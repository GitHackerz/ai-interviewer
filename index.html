<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interviewer Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .video-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .video-box {
            flex: 1;
            min-width: 280px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        video {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-start {
            background: #4CAF50;
            color: white;
        }
        
        .btn-stop {
            background: #f44336;
            color: white;
        }
        
        .btn-reset {
            background: #FF9800;
            color: white;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .status.disconnected {
            background: #ffebee;
            color: #c62828;
        }
        
        .status.connecting {
            background: #fff3e0;
            color: #e65100;
        }
        
        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .transcript {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .transcript h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
        }
        
        .message.ai {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }
        
        .message strong {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .indicator.active {
            background: #4CAF50;
        }
        
        .indicator.inactive {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 AI Interviewer</h1>
        <p class="subtitle">Practice your interview skills with AI-powered voice interaction</p>
        
        <div class="status disconnected" id="status">
            <span class="indicator inactive"></span>
            <span id="statusText">Disconnected</span>
        </div>
        
        <div class="video-container">
            <div class="video-box">
                <div class="video-label">Your Camera</div>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="video-box">
                <div class="video-label">AI Response Audio</div>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startInterview()">
                Start Interview
            </button>
            <button class="btn-stop" id="stopBtn" onclick="stopInterview()" disabled>
                Stop Interview
            </button>
            <button class="btn-reset" id="resetBtn" onclick="resetConversation()" disabled>
                Reset Conversation
            </button>
        </div>
        
        <div class="transcript">
            <h3>Conversation Transcript</h3>
            <div id="transcriptContent">
                <p style="color: #999; text-align: center;">Start the interview to see the conversation...</p>
            </div>
        </div>
    </div>

    <script>
        let pc = null;
        let peerId = null;
        let localStream = null;
        
        const statusEl = document.getElementById('status');
        const statusTextEl = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const transcriptContent = document.getElementById('transcriptContent');
        
        function updateStatus(status, text) {
            statusEl.className = 'status ' + status;
            statusTextEl.textContent = text;
            
            const indicator = statusEl.querySelector('.indicator');
            if (status === 'connected') {
                indicator.className = 'indicator active';
            } else {
                indicator.className = 'indicator inactive';
            }
        }
        
        async function startInterview() {
            try {
                updateStatus('connecting', 'Connecting...');
                startBtn.disabled = true;
                
                // Get user media (audio and video)
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                    }
                });
                
                // Display local video
                document.getElementById('localVideo').srcObject = localStream;
                
                // Create peer connection
                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                });
                
                // Add local tracks to peer connection
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
                
                // Handle incoming tracks (AI response audio)
                pc.ontrack = (event) => {
                    console.log('Received track:', event.track.kind);
                    const remoteVideo = document.getElementById('remoteVideo');
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                    }
                };
                
                // Handle connection state changes
                pc.onconnectionstatechange = () => {
                    console.log('Connection state:', pc.connectionState);
                    if (pc.connectionState === 'connected') {
                        updateStatus('connected', 'Connected - Interview in progress');
                        stopBtn.disabled = false;
                        resetBtn.disabled = false;
                    } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                        updateStatus('disconnected', 'Connection lost');
                        stopInterview();
                    }
                };
                
                // Create and send offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                // Wait for ICE gathering to complete
                await new Promise((resolve) => {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        pc.onicegatheringstatechange = () => {
                            if (pc.iceGatheringState === 'complete') {
                                resolve();
                            }
                        };
                    }
                });
                
                // Send offer to server
                const response = await fetch('/offer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                    }),
                });
                
                const data = await response.json();
                peerId = data.peer_id;
                
                // Set remote description (answer from server)
                await pc.setRemoteDescription({
                    sdp: data.sdp,
                    type: data.type,
                });
                
                console.log('WebRTC connection established');
                addTranscriptMessage('system', 'Interview started. The AI will greet you shortly. Speak clearly into your microphone.');
                
            } catch (error) {
                console.error('Error starting interview:', error);
                updateStatus('disconnected', 'Error: ' + error.message);
                startBtn.disabled = false;
                stopInterview();
            }
        }
        
        async function stopInterview() {
            if (pc) {
                pc.close();
                pc = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            
            updateStatus('disconnected', 'Disconnected');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            resetBtn.disabled = true;
        }
        
        async function resetConversation() {
            if (!peerId) return;
            
            try {
                await fetch(`/reset/${peerId}`, {
                    method: 'POST',
                });
                
                transcriptContent.innerHTML = '<p style="color: #999; text-align: center;">Conversation reset. Starting fresh...</p>';
                addTranscriptMessage('system', 'Conversation reset successfully.');
                
            } catch (error) {
                console.error('Error resetting conversation:', error);
            }
        }
        
        function addTranscriptMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (sender === 'user' ? 'user' : 'ai');
            
            let senderLabel = sender === 'user' ? '👤 You' : sender === 'ai' ? '🤖 AI Interviewer' : 'ℹ️ System';
            
            messageDiv.innerHTML = `
                <strong>${senderLabel}</strong>
                <div>${text}</div>
            `;
            
            if (transcriptContent.querySelector('p[style*="color: #999"]')) {
                transcriptContent.innerHTML = '';
            }
            
            transcriptContent.appendChild(messageDiv);
            transcriptContent.scrollTop = transcriptContent.scrollHeight;
        }
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            stopInterview();
        });
    </script>
</body>
</html>
